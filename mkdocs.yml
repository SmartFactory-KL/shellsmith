site_name: shellsmith
repo_url: https://github.com/SmartFactory-KL/shellsmith
repo_name: SmartFactory-KL/shellsmith
theme:
  name: material
  logo: images/emblem.svg
  favicon: images/favicon.ico
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - palette.toggle
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  extra:
    version:
      provider: pypi
      name: shellsmith
    manifest: images/favicon/site.webmanifest

nav:
  - Home: index.md
  - Learn:
      - learn/index.md
      - BaSyx:
          - learn/basyx/index.md
          - AAS Environment: learn/basyx/aas-environment.md
          - AAS Repository: learn/basyx/aas-repository.md
          - Submodel Repository: learn/basyx/submodel-repository.md
          - Concept Description Repository: learn/basyx/concept-description-repository.md
          - AAS Registry: learn/basyx/aas-registry.md
          - Submodel Registry: learn/basyx/submodel-registry.md
          - Discovery Service: learn/basyx/discovery-service.md
          - Web UI: learn/basyx/web-ui.md
      - FA3ST:
          - learn/fa3st/index.md
      - Asset Administration Shell:
          - learn/asset-administration-shell/index.md
  - API: api.md
  - CLI: cli.md
  - MCP: mcp.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

plugins:
  - termynal:
      buttons: windows
